create_product:
  name: Create product
  description: Add a product to the local catalogue.
  fields:
    name:
      required: true
      example: Chopped tomatoes
      selector:
        text:
    brand:
      example: Brand A
      selector:
        text:
    barcode:
      example: "0123456789012"
      selector:
        text:
    description:
      example: Long-life whole milk
      selector:
        text:
    package_size:
      example: 400
      selector:
        number:
          min: 0
          step: any
          mode: box
    package_unit:
      example: g
      selector:
        text:
    ingredient_name:
      example: Chopped tomatoes
      selector:
        text:
    default_storage_location:
      default: cupboard
      example: pantry
      selector:
        text:
          multiple: false
    reorder_threshold:
      example: 2
      selector:
        number:
          min: 0
          step: any
          mode: box
update_product:
  name: Update product
  description: Update product details without changing inventory or stock history.
  fields:
    product_id:
      required: true
      example: 13c6bcedf06d4d6990c22789f975d420
      selector:
        text:
    name:
      selector:
        text:
    brand:
      selector:
        text:
    barcode:
      selector:
        text:
    description:
      selector:
        text:
    package_size:
      selector:
        number:
          min: 0
          step: any
          mode: box
    package_unit:
      selector:
        text:
    ingredient_name:
      selector:
        text:
    default_storage_location:
      example: fridge
      selector:
        text:
          multiple: false
    reorder_threshold:
      selector:
        number:
          min: 0
          step: any
          mode: box
    clear_fields:
      description: Optional fields to clear; use package to clear package size and unit.
      selector:
        select:
          multiple: true
          options:
            - brand
            - barcode
            - description
            - package
            - reorder_threshold
            - ingredient
find_product:
  name: Find product
  description: Search product names and brands case-insensitively, or match a barcode.
  fields:
    search_term:
      required: true
      example: tomatoes
      selector:
        text:
add_stock:
  name: Add stock
  description: Add stock to the product default location or a one-off override.
  fields:
    product_id:
      example: 13c6bcedf06d4d6990c22789f975d420
      selector:
        text:
    barcode:
      example: "0123456789012"
      selector:
        text:
    quantity:
      required: true
      example: 2
      selector:
        number:
          min: 0
          step: any
          mode: box
    location:
      description: Optional override; defaults to the product storage location.
      selector:
        text:
          multiple: false
    operation_id:
      example: grocery-delivery-2026-11-09-milk
      selector:
        text:
consume_stock:
  name: Consume stock
  description: Consume stock; when omitted, stock must exist in only one location.
  fields:
    product_id:
      selector:
        text:
    barcode:
      selector:
        text:
    quantity:
      required: true
      example: 1
      selector:
        number:
          min: 0
          step: any
          mode: box
    location:
      description: Required when stock exists in more than one location.
      selector:
        text:
          multiple: false
    operation_id:
      selector:
        text:
set_stock:
  name: Set stock
  description: Set quantity at the product default location or an override.
  fields:
    product_id:
      selector:
        text:
    barcode:
      selector:
        text:
    quantity:
      required: true
      example: 0
      selector:
        number:
          min: 0
          step: any
          mode: box
    location:
      description: Optional override; defaults to the product storage location.
      selector:
        text:
          multiple: false
    operation_id:
      selector:
        text:
get_stock:
  name: Get stock
  description: Get stock for one product or all products matching a search term.
  fields:
    product_id:
      selector:
        text:
    barcode:
      selector:
        text:
    search_term:
      selector:
        text:
    location:
      selector:
        text:
          multiple: false
list_inventory:
  name: List inventory
  description: List positive stock with optional location and product-name filters.
  fields:
    location:
      selector:
        text:
          multiple: false
    product_name:
      selector:
        text:
get_stock_history:
  name: Get stock history
  description: Return recent stock transactions, newest first, with a maximum limit of 200.
  fields:
    product_id:
      selector:
        text:
    barcode:
      selector:
        text:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
          mode: slider
